# Ouvre dans chaque produit une PR qui passe à `@hgdc/config@<version>` et réaligne sa stack
# (`hgdc-stack sync`), fusionnée automatiquement quand sa CI passe.
# Appelé par release.yml ; à la main pour rattraper un produit : Actions → Propagate → Run workflow.
# Produits : variable de dépôt HGDC_PRODUCTS (tableau JSON). Jeton : secret HGDC_BOT_TOKEN
# (jeton fin, Contents et Pull requests en écriture sur les produits ; source Doppler hgdc/prd).
name: Propagate

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
    secrets:
      HGDC_BOT_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Version de @hgdc/config à propager
        type: string
        required: true

permissions: {}

jobs:
  propagate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(vars.HGDC_PRODUCTS) }}
    name: ${{ matrix.repo }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Version
        run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version invalide : $VERSION"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.HGDC_BOT_TOKEN }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Aligner sur le kit
        run: |
          bun add --dev --exact "@hgdc/config@$VERSION"
          bunx hgdc-stack sync
          bun install
      - id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.HGDC_BOT_TOKEN }}
          branch: hgdc-kit/config
          commit-message: "chore(deps): @hgdc/config ${{ inputs.version }}"
          title: "chore(deps): @hgdc/config ${{ inputs.version }}"
          body: "Nouvelle version de `@hgdc/config` et stack réalignée par `hgdc-stack sync`. Ouverte par hgdc-kit, fusionnée automatiquement quand la CI passe."
          delete-branch: true
      - if: steps.pr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ secrets.HGDC_BOT_TOKEN }}
          REPO: ${{ matrix.repo }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge --auto --squash --repo "$REPO" "$PR"
