# CI commune de la H Collection : installe depuis le lockfile, puis `bun run check`.
# Depuis un produit (Renovate tient le SHA à jour) :
#
#   jobs:
#     check:
#       uses: hugogebel-boop/hgdc-kit/.github/workflows/check.yml@<sha> # main
#
# Machine : `runner` reçoit les étiquettes de `runs-on`, en JSON. Par défaut une machine
# de GitHub. Un produit privé qui dispose d'un runner auto-hébergé y passe ses étiquettes
# (guide « Adopter le kit », section 4). Le kit, public, ne s'en sert jamais pour
# lui-même : un runner auto-hébergé exécuterait le code d'une PR venue d'un fork.
#
# `skip-paths` : expression régulière (grep -E) des fichiers qui ne changent rien au check,
# `^docs/|\.md$` par exemple. Quand tous les fichiers changés y répondent, le job finit
# vert sans rien installer : le statut `check / check` exigé par la protection de `main`
# est rendu, ce qu'un `paths-ignore` ne ferait pas (la PR resterait bloquée). Vide par
# défaut : tout changement est vérifié.
name: Check

on:
  workflow_call:
    inputs:
      runner:
        description: Étiquettes de `runs-on`, en JSON (`["ubuntu-latest"]`, `["self-hosted", "x"]`).
        type: string
        required: false
        default: '["ubuntu-latest"]'
      skip-paths:
        description: Expression régulière (grep -E) des fichiers sans effet sur le check. Vide pour tout vérifier.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ fromJSON(inputs.runner) }}
    # Sur un runner auto-hébergé partagé, l'attente d'une machine libre compte dans ce délai.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Le commit et son parent : de quoi lister les fichiers changés.
          fetch-depth: 2
      - name: fichiers changés
        id: changes
        if: inputs.skip-paths != ''
        env:
          SKIP: ${{ inputs.skip-paths }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # PR : le commit vérifié est la fusion de la PR dans sa base, son premier parent est
          # la base. Push : seulement un commit poussé seul (squash), sinon tout est vérifié.
          base=""
          case "$EVENT" in
            pull_request) base="HEAD^1" ;;
            push) [ "$BEFORE" = "$(git rev-parse HEAD^ 2>/dev/null || true)" ] && base="HEAD^" ;;
          esac
          [ -n "$base" ] || exit 0
          files="$(git diff --name-only "$base" HEAD)" || exit 0
          [ -n "$files" ] || exit 0
          if ! printf '%s\n' "$files" | grep -qvE "$SKIP"; then
            echo "Fichiers changés tous hors du check ($SKIP) : rien à vérifier."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.changes.outputs.skip != 'true'
        with:
          bun-version-file: package.json
      - if: steps.changes.outputs.skip != 'true'
        run: bun install --frozen-lockfile
      - if: steps.changes.outputs.skip != 'true'
        run: bun run check
