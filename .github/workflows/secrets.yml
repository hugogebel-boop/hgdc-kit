# Recherche de secrets commune de la H Collection : gitleaks sur tout l'historique.
# Depuis un produit (Renovate tient le SHA à jour) :
#
#   jobs:
#     secrets:
#       uses: hugogebel-boop/hgdc-kit/.github/workflows/secrets.yml@<sha> # main
#       with:
#         runner: ${{ vars.HGDC_RUNNER || '["self-hosted", "forge", "hgdc"]' }}
#
# Règles par défaut de gitleaks, plus le `.gitleaks.toml` et le `.gitleaksignore` du dépôt
# s'ils existent (faux secrets des tests : guide « Adopter le kit », section 4). Binaire
# officiel vérifié par sa somme SHA-256, sans action tierce ni jeton : rien ne dépend des
# droits du `GITHUB_TOKEN` de l'appelant. Sortie expurgée (`--redact`).
name: Secrets

on:
  workflow_call:
    inputs:
      runner:
        description: Étiquettes de `runs-on`, en JSON (`["ubuntu-latest"]`, `["self-hosted", "x"]`).
        type: string
        required: false
        default: '["ubuntu-latest"]'

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: installation de gitleaks
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$dir/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $dir/$archive" | sha256sum -c -
          tar -xzf "$dir/$archive" -C "$dir" gitleaks
          echo "$dir" >> "$GITHUB_PATH"
      - name: aucun secret dans l'historique
        run: |
          set -euo pipefail
          args=(git . --no-banner --redact --exit-code 1)
          if [ -f .gitleaks.toml ]; then args+=(--config .gitleaks.toml); fi
          gitleaks "${args[@]}"
