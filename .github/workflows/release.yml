# Publication : changesets ouvre la PR « chore: release » ; sa fusion publie sur npm
# par OIDC (trusted publishing, nom de ce fichier déclaré sur npmjs.com) puis aligne les produits
# (propagate.yml) si @hgdc/config a changé.
name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      config-version: ${{ steps.config.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # npm >= 11.5.1 pour le trusted publishing.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bun run version
          publish-script: bun run release
          commit-message: "chore: release"
          pr-title: "chore: release"
        env:
          # Jeton du bot et non GITHUB_TOKEN : une PR ouverte par GITHUB_TOKEN ne lance pas la CI,
          # que la règle de main exige. Contents et Pull requests en écriture sur ce dépôt.
          GITHUB_TOKEN: ${{ secrets.HGDC_BOT_TOKEN }}
      - id: config
        if: steps.changesets.outputs.published == 'true'
        env:
          PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: echo "version=$(jq -r '.[] | select(.name == "@hgdc/config") | .version' <<< "$PACKAGES")" >> "$GITHUB_OUTPUT"

  propagate:
    needs: release
    if: needs.release.outputs.config-version != '' && vars.HGDC_PRODUCTS != ''
    uses: ./.github/workflows/propagate.yml
    with:
      version: ${{ needs.release.outputs.config-version }}
    secrets:
      HGDC_BOT_TOKEN: ${{ secrets.HGDC_BOT_TOKEN }}
