# Publication : changesets ouvre la PR « chore: release » ; sa fusion publie sur npm
# par OIDC (trusted publishing, nom de ce fichier déclaré sur npmjs.com) puis aligne les produits.
name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      packages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # npm >= 11.5.1 pour le trusted publishing.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bun run version
          publish-script: bun run release
          commit-message: "chore: release"
          pr-title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Ouvre dans chaque produit une PR qui passe à la nouvelle @hgdc/config et réaligne sa stack,
  # fusionnée automatiquement quand sa CI passe. Produits : variable de dépôt HGDC_PRODUCTS
  # (tableau JSON de dépôts), jeton : secret HGDC_BOT_TOKEN (docs/guides/adopter-le-kit.md).
  propagate:
    needs: release
    if: needs.release.outputs.published == 'true' && contains(needs.release.outputs.packages, '"@hgdc/config"') && vars.HGDC_PRODUCTS != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(vars.HGDC_PRODUCTS) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.HGDC_BOT_TOKEN }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - id: align
        env:
          PACKAGES: ${{ needs.release.outputs.packages }}
        run: |
          version=$(jq -r '.[] | select(.name == "@hgdc/config") | .version' <<< "$PACKAGES")
          bun add --dev --exact "@hgdc/config@$version"
          bunx hgdc-stack sync
          bun install
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.HGDC_BOT_TOKEN }}
          branch: hgdc-kit/config
          commit-message: "chore(deps): @hgdc/config ${{ steps.align.outputs.version }}"
          title: "chore(deps): @hgdc/config ${{ steps.align.outputs.version }}"
          body: "Nouvelle version de `@hgdc/config` et stack réalignée par `hgdc-stack sync`. Ouverte par hgdc-kit, fusionnée automatiquement quand la CI passe."
          delete-branch: true
      - if: steps.pr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ secrets.HGDC_BOT_TOKEN }}
        run: gh pr merge --auto --squash --repo "${{ matrix.repo }}" "${{ steps.pr.outputs.pull-request-number }}"
