# Publication du kit. Ce dépôt est une copie : chaque commit sur main y est poussé par la CI de
# basalte (`kit-mirror.yml`), où les versions sont montées par la PR « chore: release ». Ici, on
# ne fait plus que publier sur npm ce qui n'y est pas encore, par OIDC (trusted publishing, nom de
# ce fichier déclaré sur npmjs.com), puis aligner les produits (propagate.yml) si @hgdc/config ou
# @hgdc/ui a changé.
name: Release

on:
  push:
    branches: [main]
  # Relance après une publication échouée : sans risque, les versions déjà publiées sont sautées.
  workflow_dispatch:

concurrency: release

permissions: {}

jobs:
  # Le check du commit copié passe avant toute publication.
  check:
    uses: ./.github/workflows/check.yml

  # Seul un commit de la copie publie : il porte la ligne `Basalte-Commit: <sha>`.
  origin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: commit de la copie
        run: |
          set -euo pipefail
          if ! git log -1 --format=%B | grep -qE '^Basalte-Commit: [0-9a-f]{40}$'; then
            echo "::error title=Commit hors copie::Ce dépôt ne reçoit que la copie du kit. Modifier le kit dans basalte."
            exit 1
          fi
      - name: aucun changeset en attente
        run: |
          set -euo pipefail
          # Les versions se montent dans basalte : un changeset ici ouvrirait une PR de release.
          pending="$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md)"
          if [ -n "$pending" ]; then
            echo "::error title=Changeset en attente::$pending"
            exit 1
          fi

  release:
    needs: [check, origin]
    if: github.repository == 'hugogebel-boop/hgdc-kit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Environnement réservé à main, et déclaré dans le trusted publisher de chaque paquet sur
    # npmjs.com : une autre branche qui lancerait ce fichier ne peut pas publier.
    environment: npm
    permissions:
      contents: write
      id-token: write
    outputs:
      config-version: ${{ steps.versions.outputs.config }}
      ui-version: ${{ steps.versions.outputs.ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # npm >= 11.5.1 pour le trusted publishing.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      # Sans changeset en attente (contrôlé par `origin`), changesets/action passe directement à la
      # publication : `bun run release` publie ce qui manque sur npm, puis l'action pousse les tags
      # et crée les releases GitHub. Une version déjà publiée est sautée : aucune double publication.
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: bun run release
          # Jeton de l'action, plus celui du bot : sans PR à ouvrir, il suffit pour les tags et les
          # releases, et la règle des tags ne laisse passer que l'app GitHub Actions et la clé de la copie.
          github-token: ${{ github.token }}
      - id: versions
        if: steps.changesets.outputs.published == 'true'
        env:
          PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          echo "config=$(jq -r '.[] | select(.name == "@hgdc/config") | .version' <<< "$PACKAGES")" >> "$GITHUB_OUTPUT"
          echo "ui=$(jq -r '.[] | select(.name == "@hgdc/ui") | .version' <<< "$PACKAGES")" >> "$GITHUB_OUTPUT"

  propagate:
    needs: release
    if: (needs.release.outputs.config-version != '' || needs.release.outputs.ui-version != '') && vars.HGDC_PRODUCTS != ''
    uses: ./.github/workflows/propagate.yml
    with:
      config: ${{ needs.release.outputs.config-version }}
      ui: ${{ needs.release.outputs.ui-version }}
    secrets:
      HGDC_BOT_TOKEN: ${{ secrets.HGDC_BOT_TOKEN }}
